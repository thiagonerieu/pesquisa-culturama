<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">

    <title>Pesquisa de Opinião</title>
</head>
<body>
    <main>
            <header>
        <img src="img/logo-culturama.png" alt="logo culturama">
        <h1>Pesquisa Online</h1>
    </header>
    <section>
        <form action="sucesso.html" method="get">
            <fieldset>
                <legend>DADOS PESSOAIS</legend>
                <label for="name">Nome:</label>
                <input id="name" type="text" name="userName" required>
                <br>
                <label for="age">Idade:</label>
                <input id="age" type="number" name="userAge" min="12" max="100" required>
                <br>
                <label for="birthDate">Data de Nascimento:</label>
                <input id="birthDate" type="date" name="userBirthDate">
                <br>           
                <label for="email">Email:</label>
                <input id="email" type="email" name="userEmail" required>
                <br>
                <label for="phone">Telefone:</label>
                <input id="phone" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + número sem espaços ou hífens" aria-describedby="phoneHelp">
                <small id="phoneHelp">Preencha com 11 dígitos no formato: DDD + números sem espaços ou hífen.</small>
                <br>
                <label for="image" accept="image/*">Upload de foto:</label>
                <input id="image" type="file" accept="image/*" name="userImage" aria-describedby="imageHelp">
                <small id="imageHelp">Envie uma foto no formato JPG ou PNG.</small>
                <br>
            </fieldset> 
            
            <fieldset>
                <legend>Perfil</legend>
                
                <p>Gênero:</p>
                <input id="fem" type="radio" name="userGender" value="Feminino">
                <label for="fem">Feminino</label>

                <input id="masc" type="radio" name="userGender" value="Masculino">
                <label for="masc">Masculino</label>
                
                <input id="notInformed" type="radio" name="userGender" value="notInformed">
                <label for="notInformed">Prefiro não informar</label>
                <br>
                
                <label for="maritalStatus">Estado Civil:</label>
                <select id="maritalStatus" name="userMaritalStatus">
                    <option value="notInformed">Selecione...</option>
                    <option value="single">Solteiro(a)</option>
                    <option value="married">Casado(a)</option>
                    <option value="stableUnion">União Estável</option>
                    <option value="divorced">Divorciado(a)</option>
                    <option value="widowed">Viúvo(a)</option>
                </select>
                <br>

                <label for="state">Estado:</label>
                <select id="state" name="userState" required>
                    <option value="notInformed">Selecione...</option>
                    <option value="acre">Acre (AC)</option>
                    <option value="alagoas">Alagoas (AL)</option>    
                    <option value="amapa">Amapá (AP)</option>
                    <option value="amazonas">Amazonas (AM)</option>
                    <option value="bahia">Bahia (BA)</option>
                    <option value="ceara">Ceará (CE)</option>
                    <option value="espiritoSanto">Espírito Santo (ES)</option>
                    <option value="goias">Goiás (GO)</option>
                    <option value="maranhao">Maranhão (MA)</option>
                    <option value="matoGrosso">Mato Grosso (MT)</option>
                    <option value="matoGrossoDoSul">Mato Grosso do Sul (MS)</option>
                    <option value="minasGerais">Minas Gerais (MG)</option>
                    <option value="para">Pará (PA)</option>
                    <option value="paraiba">Paraíba (PB)</option>
                    <option value="parana">Paraná (PR)</option>
                    <option value="pernambuco">Pernambuco (PE)</option>
                    <option value="piaui">Piauí (PI)</option>
                    <option value="rioDeJaneiro">Rio de Janeiro (RJ)</option>
                    <option value="rioGrandeDoNorte">Rio Grande do Norte (RN)</option>
                    <option value="rioGrandeDoSul">Rio Grande do Sul (RS)</option>
                    <option value="rondonia">Rondônia (RO)</option>
                    <option value="roraima">Roraima (RR)</option>
                    <option value="santaCatarina">Santa Catarina (SC)</option>
                    <option value="saoPaulo">São Paulo (SP)</option>
                    <option value="sergipe">Sergipe (SE)</option>
                    <option value="tocantins">Tocantins (TO)</option>
                    <option value="distritoFederal">Distrito Federal (DF)</option>
                </select>
                <br>

                <label for="city">Cidade:</label>
                <input id="city" type="text" name="userCity">

            </fieldset>

            <fieldset>
                <legend>Hábitos</legend>
                <p>Redes Sociais:</p>
            <input id="instagram" type="checkbox" name="social" value="instagram">
                <label for="instagram">Instagram</label>
                <br>
                <input id="facebook" type="checkbox" name="social" value="facebook">
                <label for="facebook">Facebook</label>
                <br>
                <input id="X" type="checkbox" name="social" value="X">
                <label for="X">X</label>
                <br>
                <input id="tiktok" type="checkbox" name="social" value="tiktok">
                <label for="tiktok">TikTok</label>
                <br>
                <input id="linkedin" type="checkbox" name="social" value="linkedin">
                <label for="linkedin">LinkedIn</label>
                <br>
                <label for="musicStyle">Estilo musical:</label>
                <input list="styleTypes" id="musicStyle" type="text" name="userMusicStyle">
                <datalist id="styleTypes">
                    <option value="Rock">Rock</option>
                    <option value="Pop">Pop</option>
                    <option value="Sertanejo">Sertanejo</option>
                    <option value="Pagode">Pagode</option>
                    <option value="Funk">Funk</option>
                    <option value="Forró">Forró</option>
                    <option value="MPB">MPB</option>
                    <option value="Samba">Samba</option>
                </datalist>
                <br>

                <label for="favoriteColor">Cor favorita:</label>
                <input id="favoriteColor" type="color" name="userFavoriteColor">
            </fieldset>

            <fieldset>
                <legend>Sua Opinião</legend>
                <p>Escala de satisafação:</p>
                <label for="opinion"></label>
                <input id="otima" type="radio" name="userServiceOpinion" value="otima">
                <label for="otima">Ótima</label>
                <br>
                <input id="boa" type="radio" name="userServiceOpinion" value="boa">
                <label for="boa">Boa</label>
                <br>
                <input id="regular" type="radio" name="userServiceOpinion" value="regular">
                <label for="regular">Regular</label>
                <br>
                <input id="ruim" type="radio" name="userServiceOpinion" value="ruim">    
                <label for="ruim">Ruim</label>
                <br>
                <label for="comment">Escreva sua opinião:</label>
                <textarea id="comment" name="userComment" placeholder="Digite sua opinião aqui..."></textarea>
            </fieldset>

            <fieldset>
                <legend>Confirmações</legend>
                <input id="userLgpdTerm" type="checkbox" name="userLgpd" value="accepted" required>
                <label for="userLgpdTerm">Li e aceito participar da pesquisa.</label><br>

                <input id="getResult" type="checkbox" name="userGetResult" value="accepted">
                <label for="userLgpdTerm">Desejo receber o resultado por e-mail.</label><br>
            </fieldset>
            <button type="submit" aria-label="Enviar dados do formulário">Enviar</button>
            <button type="reset" aria-label="Limpar dados do formulário">Limpar</button>
            
        </form>
    </section>
    </main>    

</body>
</html>
